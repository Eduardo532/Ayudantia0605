name: Docker Publish CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Mantenemos esto igual, la acción de metadata se encargará de pasarlo a minúsculas
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NUEVO PASO: Extrae los metadatos y convierte el nombre a minúsculas automáticamente
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      # PASO MODIFICADO: Usamos las etiquetas generadas por el paso anterior
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Aquí consumimos el output del paso de metadata (ya formateado a minúsculas)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
